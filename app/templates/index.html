<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Mockmaster — Fake API endpoints in 1 second</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            ink: {
              950: '#08080a', 900: '#0a0a0c', 850: '#0d0d10',
              800: '#121216', 700: '#1a1a20', 600: '#26262e', 500: '#3a3a44',
            },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <style>
    html, body { background: #08080a; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #26262e; border-radius: 8px; border: 2px solid #08080a; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a44; }
    textarea { tab-size: 2; }
    .grid-bg {
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
      background-size: 22px 22px;
    }
    @keyframes slidein { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    .animate-slidein { animation: slidein .25s cubic-bezier(.16,1,.3,1); }
    @keyframes toastin { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .animate-toastin { animation: toastin .2s ease-out; }
  </style>
</head>
<body class="font-sans text-neutral-200 antialiased grid-bg min-h-screen">

  <!-- Top bar -->
  <header class="sticky top-0 z-30 border-b border-ink-700/70 bg-ink-950/80 backdrop-blur-xl">
    <div class="mx-auto max-w-6xl px-5 sm:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-white to-neutral-400 flex items-center justify-center shadow-lg shadow-white/5">
          <svg viewBox="0 0 24 24" class="h-5 w-5 text-ink-950" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/>
          </svg>
        </div>
        <div class="leading-tight">
          <div class="font-semibold tracking-tight text-[15px] text-white">API Mockmaster</div>
          <div class="text-[11px] text-neutral-500">Fake API endpoints in one second</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/docs" target="_blank"
           class="text-xs font-medium text-neutral-400 hover:text-white transition px-3 py-1.5 rounded-md border border-ink-600 hover:border-ink-500 hover:bg-ink-800">
          API Docs ↗
        </a>
        <div id="user-chip" class="hidden items-center gap-2 pl-2">
          <span id="user-email" class="text-xs font-mono text-neutral-400 max-w-[160px] truncate"></span>
          <button id="logout-btn"
            class="text-xs font-medium text-neutral-400 hover:text-rose-300 transition px-2.5 py-1.5 rounded-md border border-ink-600 hover:border-rose-500/40 hover:bg-rose-500/10">
            Log out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ Auth gate ============ -->
  <div id="auth-overlay" style="display:none" class="fixed inset-0 z-40 grid-bg bg-ink-950/95 backdrop-blur-sm flex items-center justify-center px-5">
    <div class="w-full max-w-sm animate-slidein">
      <div class="flex items-center gap-3 mb-6 justify-center">
        <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-white to-neutral-400 flex items-center justify-center shadow-lg shadow-white/5">
          <svg viewBox="0 0 24 24" class="h-5 w-5 text-ink-950" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        </div>
        <span class="font-semibold tracking-tight text-white text-lg">API Mockmaster</span>
      </div>
      <div class="bg-ink-850 border border-ink-700 rounded-2xl p-6 shadow-2xl shadow-black/50">
        <h2 id="auth-title" class="text-base font-semibold text-white">Sign in to your account</h2>
        <p id="auth-sub" class="text-sm text-neutral-500 mt-1">Manage your mock endpoints.</p>
        <form id="auth-form" class="mt-5 space-y-3">
          <div>
            <label class="block text-[11px] uppercase tracking-wide text-neutral-500 mb-1.5">Email</label>
            <input id="auth-email" type="email" required autocomplete="email" placeholder="you@example.com"
              class="w-full bg-ink-800 border border-ink-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-ink-500 transition" />
          </div>
          <div>
            <label class="block text-[11px] uppercase tracking-wide text-neutral-500 mb-1.5">Password</label>
            <input id="auth-password" type="password" required autocomplete="current-password" placeholder="••••••••" minlength="8"
              class="w-full bg-ink-800 border border-ink-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-ink-500 transition" />
            <p id="auth-pw-hint" class="hidden text-[11px] text-neutral-500 mt-1">At least 8 characters.</p>
          </div>
          <button type="submit" id="auth-submit"
            class="w-full bg-white text-ink-950 font-semibold text-sm rounded-lg px-4 py-2.5 hover:bg-neutral-200 active:scale-[.99] transition shadow-lg shadow-white/5 disabled:opacity-50">
            Sign in
          </button>
        </form>
        <div class="mt-4 text-center text-sm text-neutral-500">
          <span id="auth-toggle-text">No account yet?</span>
          <button id="auth-toggle" class="text-white font-medium hover:underline ml-1">Create one</button>
        </div>
      </div>
    </div>
  </div>

  <main id="app-main" style="display:none" class="mx-auto max-w-6xl px-5 sm:px-8 py-8 grid grid-cols-1 lg:grid-cols-5 gap-8">

    <!-- ============ Editor ============ -->
    <section class="lg:col-span-2">
      <div class="lg:sticky lg:top-24">
        <h1 class="text-lg font-semibold text-white tracking-tight">Create a mock</h1>
        <p class="text-sm text-neutral-500 mt-1">Define a response, hit generate, get a live URL.</p>

        <form id="mock-form" class="mt-5 space-y-4">
          <input type="hidden" id="editing-id" value="" />

          <!-- Method + Path -->
          <div class="flex gap-2">
            <div class="w-32 shrink-0">
              <label class="block text-[11px] uppercase tracking-wide text-neutral-500 mb-1.5">Method</label>
              <select id="method"
                class="w-full bg-ink-800 border border-ink-600 rounded-lg px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-ink-500 transition">
                <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
              </select>
            </div>
            <div class="flex-1 min-w-0">
              <label class="block text-[11px] uppercase tracking-wide text-neutral-500 mb-1.5">Path</label>
              <div class="flex items-center bg-ink-800 border border-ink-600 rounded-lg focus-within:ring-2 focus-within:ring-white/20 focus-within:border-ink-500 transition">
                <span class="pl-3 text-neutral-600 font-mono text-sm select-none">/</span>
                <input id="path" type="text" placeholder="api/v1/posts" autocomplete="off"
                  class="w-full bg-transparent px-1.5 py-2.5 text-sm font-mono text-white placeholder-neutral-600 focus:outline-none" />
              </div>
            </div>
          </div>

          <!-- Status + Delay -->
          <div class="flex gap-2">
            <div class="flex-1">
              <label class="block text-[11px] uppercase tracking-wide text-neutral-500 mb-1.5">Status code</label>
              <input id="status_code" type="number" value="200" min="100" max="599"
                class="w-full bg-ink-800 border border-ink-600 rounded-lg px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-ink-500 transition" />
            </div>
            <div class="flex-1">
              <label class="block text-[11px] uppercase tracking-wide text-neutral-500 mb-1.5">Delay (ms)</label>
              <input id="delay_ms" type="number" value="0" min="0" max="60000" placeholder="0"
                class="w-full bg-ink-800 border border-ink-600 rounded-lg px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-ink-500 transition" />
            </div>
          </div>

          <!-- Response body -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-[11px] uppercase tracking-wide text-neutral-500">Response JSON</label>
              <div class="flex items-center gap-2">
                <span id="json-status" class="text-[11px] font-mono"></span>
                <button type="button" id="format-btn"
                  class="text-[11px] text-neutral-400 hover:text-white transition px-2 py-0.5 rounded border border-ink-600 hover:bg-ink-700">Format</button>
              </div>
            </div>
            <textarea id="response_body" rows="11" spellcheck="false"
              class="w-full bg-ink-800 border border-ink-600 rounded-lg px-3 py-3 text-[13px] font-mono text-white placeholder-neutral-600 leading-relaxed focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-ink-500 transition resize-y"
              placeholder='{\n  "id": 1,\n  "name": "Ada Lovelace"\n}'>{
  "id": 1,
  "name": "Ada Lovelace",
  "role": "engineer"
}</textarea>
          </div>

          <div class="flex gap-2 pt-1">
            <button type="submit" id="submit-btn"
              class="flex-1 bg-white text-ink-950 font-semibold text-sm rounded-lg px-4 py-2.5 hover:bg-neutral-200 active:scale-[.99] transition shadow-lg shadow-white/5 disabled:opacity-50 disabled:cursor-not-allowed">
              Generate endpoint
            </button>
            <button type="button" id="cancel-edit" class="hidden px-4 py-2.5 text-sm rounded-lg border border-ink-600 text-neutral-400 hover:bg-ink-800 hover:text-white transition">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ============ List ============ -->
    <section class="lg:col-span-3">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-white tracking-tight">My mock endpoints</h2>
        <span id="count-badge" class="text-xs font-mono text-neutral-500 bg-ink-800 border border-ink-700 rounded-full px-2.5 py-1">0</span>
      </div>

      <div id="empty-state" class="hidden text-center py-20 border border-dashed border-ink-700 rounded-xl">
        <div class="mx-auto h-11 w-11 rounded-full bg-ink-800 border border-ink-700 flex items-center justify-center mb-3">
          <svg viewBox="0 0 24 24" class="h-5 w-5 text-neutral-600" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </div>
        <p class="text-sm text-neutral-500">No mocks yet. Create one on the left.</p>
      </div>

      <div id="mock-list" class="space-y-3"></div>
    </section>
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 items-end"></div>

  <script>
  // ======================================================================
  //  API Mockmaster — dashboard SPA
  // ======================================================================
  const API_BASE = window.location.origin;
  const METHOD_COLORS = {
    GET:    "text-emerald-400 bg-emerald-400/10 border-emerald-400/20",
    POST:   "text-sky-400 bg-sky-400/10 border-sky-400/20",
    PUT:    "text-amber-400 bg-amber-400/10 border-amber-400/20",
    PATCH:  "text-violet-400 bg-violet-400/10 border-violet-400/20",
    DELETE: "text-rose-400 bg-rose-400/10 border-rose-400/20",
  };

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- auth state ----------
  const TOKEN_KEY = "mockmaster_token";
  let authToken = localStorage.getItem(TOKEN_KEY) || null;

  function setToken(t) {
    authToken = t;
    if (t) localStorage.setItem(TOKEN_KEY, t);
    else localStorage.removeItem(TOKEN_KEY);
  }

  // Authenticated fetch: injects the Bearer token and force-logs-out on 401.
  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (authToken) headers["Authorization"] = `Bearer ${authToken}`;
    const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
    if (res.status === 401) {
      setToken(null);
      showAuth();
      throw new Error("Your session expired. Please sign in again.");
    }
    return res;
  }

  function toast(msg, kind = "info") {
    const colors = {
      success: "border-emerald-500/40 text-emerald-300",
      error:   "border-rose-500/40 text-rose-300",
      info:    "border-ink-500 text-neutral-200",
    };
    const el = document.createElement("div");
    el.className = `animate-toastin bg-ink-850 border ${colors[kind]} rounded-lg px-4 py-2.5 text-sm shadow-2xl shadow-black/40 max-w-sm`;
    el.textContent = msg;
    $("toast-container").appendChild(el);
    setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 3200);
  }

  async function copy(text, label = "URL copied to clipboard") {
    try {
      await navigator.clipboard.writeText(text);
      toast(label, "success");
    } catch {
      // Fallback for non-secure contexts.
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); toast(label, "success"); }
      catch { toast("Copy failed — select and copy manually", "error"); }
      t.remove();
    }
  }

  // ---------- live JSON validation ----------
  function validateJson() {
    const raw = $("response_body").value.trim();
    const status = $("json-status");
    if (raw === "") { status.textContent = ""; $("response_body").classList.remove("border-rose-500/60"); return true; }
    try {
      JSON.parse(raw);
      status.textContent = "✓ valid JSON";
      status.className = "text-[11px] font-mono text-emerald-400";
      $("response_body").classList.remove("border-rose-500/60");
      return true;
    } catch (e) {
      status.textContent = "✗ invalid JSON";
      status.className = "text-[11px] font-mono text-rose-400";
      $("response_body").classList.add("border-rose-500/60");
      return false;
    }
  }
  $("response_body").addEventListener("input", validateJson);

  $("format-btn").addEventListener("click", () => {
    const raw = $("response_body").value.trim();
    if (raw === "") return;
    try {
      $("response_body").value = JSON.stringify(JSON.parse(raw), null, 2);
      validateJson();
      toast("Formatted", "success");
    } catch {
      toast("Cannot format — JSON is invalid", "error");
      validateJson();
    }
  });

  // ---------- build a usable mock URL ----------
  const mockUrl = (m) => `${API_BASE}/mock/${m.id}${m.path ? "/" + m.path : ""}`;

  // ---------- render list ----------
  function render(mocks) {
    const list = $("mock-list");
    $("count-badge").textContent = mocks.length;
    $("empty-state").classList.toggle("hidden", mocks.length > 0);
    list.innerHTML = "";

    for (const m of mocks) {
      const url = mockUrl(m);
      const color = METHOD_COLORS[m.method] || METHOD_COLORS.GET;
      const delayTag = m.delay_ms > 0
        ? `<span class="text-[11px] font-mono text-amber-300/80 bg-amber-400/5 border border-amber-400/15 rounded px-1.5 py-0.5">⏱ ${m.delay_ms}ms</span>` : "";
      const statusTag = `<span class="text-[11px] font-mono text-neutral-400 bg-ink-700/60 border border-ink-600 rounded px-1.5 py-0.5">${m.status_code}</span>`;

      const card = document.createElement("div");
      card.className = "animate-slidein group bg-ink-850 border border-ink-700 rounded-xl p-4 hover:border-ink-500 transition";
      card.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-[11px] font-mono font-bold px-2 py-0.5 rounded border ${color}">${m.method}</span>
              ${statusTag}${delayTag}
            </div>
            <div class="mt-2 font-mono text-[13px] text-neutral-300 truncate">/${escapeHtml(m.path)}</div>
          </div>
          <div class="flex items-center gap-1 opacity-60 group-hover:opacity-100 transition shrink-0">
            <button data-act="edit" class="p-1.5 rounded-md hover:bg-ink-700 text-neutral-400 hover:text-white transition" title="Edit">
              <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button data-act="delete" class="p-1.5 rounded-md hover:bg-rose-500/15 text-neutral-400 hover:text-rose-300 transition" title="Delete">
              <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
            </button>
          </div>
        </div>
        <div class="mt-3 flex items-center gap-2 bg-ink-900 border border-ink-700 rounded-lg px-2.5 py-2">
          <span class="text-[11px] font-mono text-neutral-500 shrink-0 hidden sm:inline">URL</span>
          <code class="flex-1 text-[12px] font-mono text-sky-300/90 truncate select-all">${escapeHtml(url)}</code>
          <button data-act="copy" class="shrink-0 text-[11px] font-medium px-2.5 py-1 rounded-md bg-white text-ink-950 hover:bg-neutral-200 active:scale-95 transition">Copy</button>
        </div>`;

      card.querySelector('[data-act="copy"]').onclick = () => copy(url);
      card.querySelector('[data-act="edit"]').onclick = () => startEdit(m);
      card.querySelector('[data-act="delete"]').onclick = () => del(m);
      list.appendChild(card);
    }
  }

  // ---------- data ops ----------
  async function load() {
    try {
      const res = await api(`/api/mocks`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      render(await res.json());
    } catch (e) {
      toast(`Failed to load mocks: ${e.message}`, "error");
    }
  }

  function readForm() {
    return {
      path: $("path").value.trim().replace(/^\/+/, ""),
      method: $("method").value,
      status_code: parseInt($("status_code").value || "200", 10),
      delay_ms: parseInt($("delay_ms").value || "0", 10),
      response_body: $("response_body").value.trim() || "{}",
    };
  }

  $("mock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!validateJson()) {
      toast("Fix the JSON before generating", "error");
      return;
    }
    const payload = readForm();
    const editingId = $("editing-id").value;
    const btn = $("submit-btn");
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = editingId ? "Saving…" : "Generating…";

    try {
      const res = await api(
        editingId ? `/api/mocks/${editingId}` : `/api/mocks`,
        {
          method: editingId ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }
      );
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const detail = Array.isArray(err.detail)
          ? err.detail.map((d) => d.msg).join(", ")
          : err.detail || `HTTP ${res.status}`;
        throw new Error(detail);
      }
      const mock = await res.json();
      if (editingId) {
        toast("Mock updated", "success");
        resetForm();
      } else {
        copy(mockUrl(mock), "Endpoint created — URL copied!");
      }
      await load();
    } catch (e) {
      toast(`Error: ${e.message}`, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  function startEdit(m) {
    $("editing-id").value = m.id;
    $("method").value = m.method;
    $("path").value = m.path;
    $("status_code").value = m.status_code;
    $("delay_ms").value = m.delay_ms;
    try { $("response_body").value = JSON.stringify(JSON.parse(m.response_body), null, 2); }
    catch { $("response_body").value = m.response_body; }
    validateJson();
    $("submit-btn").textContent = "Save changes";
    $("cancel-edit").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetForm() {
    $("editing-id").value = "";
    $("mock-form").reset();
    $("response_body").value = '{\n  "id": 1,\n  "name": "Ada Lovelace",\n  "role": "engineer"\n}';
    $("status_code").value = "200";
    $("delay_ms").value = "0";
    $("submit-btn").textContent = "Generate endpoint";
    $("cancel-edit").classList.add("hidden");
    validateJson();
  }
  $("cancel-edit").addEventListener("click", resetForm);

  async function del(m) {
    if (!confirm(`Delete ${m.method} /${m.path}?`)) return;
    try {
      const res = await api(`/api/mocks/${m.id}`, { method: "DELETE" });
      if (!res.ok && res.status !== 204) throw new Error(`HTTP ${res.status}`);
      toast("Mock deleted", "success");
      if ($("editing-id").value === m.id) resetForm();
      await load();
    } catch (e) {
      toast(`Delete failed: ${e.message}`, "error");
    }
  }

  // ======================================================================
  //  Auth flow
  // ======================================================================
  let authMode = "login"; // "login" | "register"

  function showAuth() {
    $("auth-overlay").style.display = "flex";
    $("app-main").style.display = "none";
    $("user-chip").classList.add("hidden");
    $("user-chip").classList.remove("flex");
  }

  function showApp(email) {
    $("auth-overlay").style.display = "none";
    $("app-main").style.display = "grid";
    $("user-email").textContent = email;
    $("user-chip").classList.remove("hidden");
    $("user-chip").classList.add("flex");
  }

  function setAuthMode(mode) {
    authMode = mode;
    const isLogin = mode === "login";
    $("auth-title").textContent = isLogin ? "Sign in to your account" : "Create your account";
    $("auth-sub").textContent = isLogin ? "Manage your mock endpoints." : "Start mocking APIs in seconds — free.";
    $("auth-submit").textContent = isLogin ? "Sign in" : "Create account";
    $("auth-toggle-text").textContent = isLogin ? "No account yet?" : "Already have an account?";
    $("auth-toggle").textContent = isLogin ? "Create one" : "Sign in";
    $("auth-pw-hint").classList.toggle("hidden", isLogin);
    $("auth-password").setAttribute("autocomplete", isLogin ? "current-password" : "new-password");
  }

  $("auth-toggle").addEventListener("click", () => setAuthMode(authMode === "login" ? "register" : "login"));

  $("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("auth-email").value.trim();
    const password = $("auth-password").value;
    const btn = $("auth-submit");
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = authMode === "login" ? "Signing in…" : "Creating…";
    try {
      const res = await fetch(`${API_BASE}/api/auth/${authMode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const detail = Array.isArray(err.detail)
          ? err.detail.map((d) => d.msg).join(", ")
          : err.detail || `HTTP ${res.status}`;
        throw new Error(detail);
      }
      const data = await res.json();
      setToken(data.access_token);
      showApp(data.user.email);
      $("auth-form").reset();
      toast(authMode === "login" ? "Welcome back" : "Account created — welcome!", "success");
      await load();
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  $("logout-btn").addEventListener("click", () => {
    setToken(null);
    showAuth();
    setAuthMode("login");
    toast("Signed out", "info");
  });

  // ---------- init ----------
  validateJson();
  async function boot() {
    if (!authToken) { showAuth(); setAuthMode("login"); return; }
    try {
      const res = await api(`/api/auth/me`);
      if (!res.ok) throw new Error("session");
      const user = await res.json();
      showApp(user.email);
      await load();
    } catch {
      showAuth();
      setAuthMode("login");
    }
  }
  boot();
  </script>
</body>
</html>
