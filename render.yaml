# Render Blueprint — one-click deploy of API Mockmaster.
# In the Render dashboard: New + → "Blueprint" → pick this repo, then Apply.
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE: Render's free tier allows only ONE free Postgres per account. This
# Blueprint therefore does NOT provision a database — instead, set DATABASE_URL
# in the Render dashboard to an existing managed Postgres' connection string.
# (Want a dedicated DB? Add a `databases:` block and an env var with
#  `fromDatabase`, using a paid plan or after freeing your existing free DB.)

services:
  - type: web
    name: api-mockmaster
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    # Run migrations, then boot. $PORT is provided by Render.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Strong random signing key, generated once by Render and kept stable.
      - key: SECRET_KEY
        generateValue: true
      # Schema is owned by Alembic in production — don't auto-create.
      - key: AUTO_CREATE_TABLES
        value: "0"
      # Set this manually in the dashboard to your existing Postgres' connection
      # string (Internal Database URL). The app auto-normalises postgres:// to the
      # right driver, so paste it verbatim. Our tables (users, mock_endpoints) are
      # namespaced, so they coexist safely with anything else in that database.
      - key: DATABASE_URL
        sync: false
