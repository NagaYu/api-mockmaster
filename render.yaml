# Render Blueprint — one-click deploy of API Mockmaster.
# In the Render dashboard: New + → "Blueprint" → pick this repo. Render reads this
# file and provisions the web service AND a managed Postgres database automatically.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: api-mockmaster
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    # Run migrations, then boot. $PORT is provided by Render.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Strong random signing key, generated once by Render and kept stable.
      - key: SECRET_KEY
        generateValue: true
      # Schema is owned by Alembic in production — don't auto-create.
      - key: AUTO_CREATE_TABLES
        value: "0"
      # Wire the managed Postgres connection string in automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: mockmaster-db
          property: connectionString

databases:
  - name: mockmaster-db
    plan: free
    # Render's free Postgres is ideal for a demo. Upgrade the plan for production.
